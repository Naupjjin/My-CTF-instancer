# One container of our own and one network of our own:
#
#   instancer  the web UI, and the only thing that talks to the Docker socket
#   control    where it and the proxies find each other; instances are never on it
#
# The proxies are not here. There is one per challenge and only the instancer
# knows how many that is, so it creates them itself -- on the control network,
# each with an address of its own to bind and the host port its config.yml asks
# for. Adding a challenge is a directory under challenges/ and a restart; this
# file never changes for it.
#
# Nor is anything about a challenge here: its mode, its port, its lifetime, its
# subnet pool, its instance port range and its cap all live in
# challenges/<id>/config.yml, because there is one of each per challenge and only
# one environment. What is left below is this deployment and nothing else -- and
# all of it fits here, which is why the instancer has no config file of its own.
services:
  instancer:
    build:
      context: .
      dockerfile: Dockerfile.instancer
    ports:
      # Only the UI. Each challenge's proxy publishes its own port when the
      # instancer creates it -- see the proxy_port in challenges/*/config.yml.
      - "${LISTEN_PORT:-5000}:${LISTEN_PORT:-5000}"
    networks:
      control:
    volumes:
      - ./challenges:/challenges:ro
      - ./proxy-core:/proxy-core:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Keep this stable (e.g. in a .env file): it signs the session cookies
      # that decide who owns which instance across restarts.
      SECRET_KEY: ${SECRET_KEY:-}
      # The one secret shared with the proxies. Each proxy is handed a token
      # derived from this, so no two challenges share one. Change it in .env for
      # anything but a local run.
      PROXY_TOKEN: ${PROXY_TOKEN:-dev-proxy-token}
      LISTEN_PORT: ${LISTEN_PORT:-5000}
      # What this deployment calls itself: the titlebar, the boot banner, and the
      # first line in the log.
      INSTANCER_NAME: ${INSTANCER_NAME:-SpawnZero}
      # Set this only when players reach the proxies under a different name than
      # this page (a second host, a DNS name). Empty = same host as the UI. A
      # challenge may override it in its own config.yml.
      PROXY_HOST: ${PROXY_HOST:-}
      # Challenge and proxy images are built once, only if missing, so startup is
      # instant on every boot after the first. Set this after editing a challenge
      # to rebuild them on the next start.
      # FORCE_BUILD: 1
    # On `docker compose down` the instancer destroys the instances and proxies
    # it created -- compose does not know about any of them. Give it room to
    # finish; the default 10s is not much when a full house has to come down.
    stop_grace_period: 60s
    restart: unless-stopped

networks:
  control:
    # The name the instancer looks for (CONTROL_NETWORK). The proxies reach the
    # instancer over it, by service name.
    name: ctf-control
    ipam:
      config:
        - subnet: 10.239.0.0/24
