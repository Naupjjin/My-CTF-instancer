# This challenge, as players see it and as the instancer runs it. The directory
# name (special-love) is the id: it is in the URL, and in the name of every
# container and network an instance of this challenge is made of.

# The heading on the page.
name: Special Love
author: naup
type: pwn

# How players reach it, and where. `netcat` gets an `nc host port` command and a
# key to paste; `http` gets a clickable link with the key already in it.
#
# The proxy port is a real host port, and this challenge's proxy has it to
# itself -- it is the one setting here that must not collide with another
# challenge's.
mode: netcat
proxy_port: 1337

# How long an instance of this challenge lives before the reaper destroys it,
# in seconds. Nothing a player sends can ask for longer.
ttl: 3600

# Where an instance of this challenge lives: one /24 out of this pool, and one
# port out of this range, both its own.
#
# The pool is real address space, so give each challenge its own -- two pointing
# at the same one share it, and run out sooner. The port range is not: an
# instance port only exists inside that instance's own network, so it collides
# with nothing on the host and nothing in another challenge. What the range
# really decides is how many instances of this challenge can be up at once --
# 30000-30100 is 101 of them.
subnet_pool: 10.240.0.0/16
subnet_prefix: 24
instance_ports: 30000-30100

# Blast radius of one instance. Empty leaves the limit to Docker.
mem_limit: 512m
pids_limit: 256
