# This challenge, as players see it and as the instancer runs it. Copy this
# directory into challenges/ under the name you want it served as -- the
# directory name is the id, and it is what goes in the URL and in the name of
# every container and network an instance of it is made of.

# The heading on the page.
name: Netcat Challenge
author: you
type: pwn

# How players reach it, and where. `netcat` gets an `nc host port` command and a
# key to paste; `http` gets a clickable link with the key already in it.
#
# The proxy port is a real host port, and this challenge's proxy has it to
# itself -- it is the one setting here that must not collide with another
# challenge's.
mode: netcat
proxy_port: 1339

# How long an instance of this challenge lives before the reaper destroys it,
# in seconds. Nothing a player sends can ask for longer.
ttl: 3600

# Where an instance of this challenge lives: one /24 out of this pool, and one
# port out of this range, both its own. Give each challenge a pool of its own --
# address space is real, and two challenges pointed at the same pool share it.
# The port range is not shared space at all: an instance port only exists inside
# that instance's own network. What it really decides is how many instances of
# this challenge can be up at once.
subnet_pool: 10.242.0.0/16
subnet_prefix: 24
instance_ports: 30000-30100

# Blast radius of one instance. Empty leaves the limit to Docker.
mem_limit: 512m
pids_limit: 256
