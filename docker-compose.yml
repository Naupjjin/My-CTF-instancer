services:
  instancer:
    build:
      context: .
      dockerfile: Dockerfile.instancer
    # Host networking: the ports handed out to players and the ports the
    # instancer bind-checks must be the same network namespace.
    network_mode: host
    volumes:
      - ./challenge:/challenge:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Keep this stable (e.g. in a .env file): it signs the session cookies
      # that decide who owns which instance across restarts.
      SECRET_KEY: ${SECRET_KEY:-}
      PORT_MIN: 30000
      PORT_MAX: 30100
      CHALLENGE_DIR: /challenge
      CHALLENGE_IMAGE: ctf-challenge:latest
      # The challenge image is built once, only if missing, so startup is instant
      # on every boot after the first. Set FORCE_BUILD=1 after editing the
      # challenge to rebuild it on the next start.
      # FORCE_BUILD: 1
      # This challenge is a pwn service: xinetd serves the binary over raw TCP
      # on 41240, so players connect with netcat, not a browser.
      CONTAINER_PORT: 41240
      MODE: netcat
      # Each instance gets its own /24 out of this pool.
      SUBNET_POOL: 10.240.0.0/16
      SUBNET_PREFIX: 24
      # Instance TTL (seconds): how long each instance lives before the reaper
      # destroys it. This is THE knob for instance lifetime — the web UI does not
      # let players choose, it just uses this value.
      DEFAULT_TTL: 3600
      # Hard ceiling for a TTL requested via the API; and how often the reaper runs.
      MAX_TTL: 86400
      CLEANUP_INTERVAL: 10
      LISTEN_PORT: 5000
    restart: unless-stopped
